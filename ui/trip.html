<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip computer · F-Type-OpenCluster</title>
<style>
  :root { color-scheme: dark; font-family: "Barlow", "Segoe UI", sans-serif; color: #eef0ed; background: #151716; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
  main { width: min(100%, 620px); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 16px; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .025em; }
  header span, footer { color: #acb2ad; font-size: .85rem; }
  .bezel { padding: clamp(14px, 3.4vw, 28px); border-radius: 18px; border: 1px solid #494b46; background: linear-gradient(155deg, #373b39, #242725 22%, #1b1d1c 80%, #333634); box-shadow: 0 12px 38px #0005; }
  .screen { padding: clamp(18px, 5vw, 44px); background: #0b1113; border: 2px solid #080a09; border-radius: 5px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: .8rem; border-bottom: 1px solid #526365; }
  .top h2 { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 500; margin: 0; }
  #bank { text-transform: uppercase; letter-spacing: .13em; font-size: .9rem; color: #a9d9dd; }
  dl { margin: 0; }
  dl > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 16px 0; border-bottom: 1px solid #283337; }
  dl > div:last-child { padding-bottom: 0; border: 0; }
  dt { color: #b9c7c9; font-size: clamp(.84rem, 2.8vw, 1rem); }
  dd { font-variant-numeric: tabular-nums; margin: 0; font-size: clamp(1.3rem, 4.8vw, 2rem); white-space: nowrap; }
  dd small { color: #a9d9dd; font-size: .52em; }
  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 24px; padding: 18px 2px 0; }
  fieldset { margin: 0; padding: 0; border: 0; }
  legend { color: #bac0ba; font-size: .78rem; margin-bottom: 8px; }
  label { display: inline-block; position: relative; }
  input { position: absolute; opacity: 0; }
  label span { display: inline-block; border: 1px solid #555c55; padding: 7px 13px; border-radius: 3px; cursor: pointer; }
  input:checked + span { background: #cedbd4; color: #13241d; border-color: #cedbd4; }
  input:focus-visible + span { outline: 2px solid #b1e4e9; outline-offset: 3px; }
  footer { margin-top: 24px; line-height: 1.5; }
</style>
<main>
  <header><h1>F-Type-OpenCluster</h1><span>X152 · Trip display</span></header>
  <div class="bezel">
    <section class="screen" aria-labelledby="screen-title" aria-live="polite">
      <div class="top"><h2 id="screen-title">Trip computer</h2><strong id="bank">Trip A</strong></div>
      <dl>
        <div><dt>Distance</dt><dd><output id="distance"></output> <small id="distance-unit"></small></dd></div>
        <div><dt>Average speed</dt><dd><output id="speed"></output> <small id="speed-unit"></small></dd></div>
        <div><dt>Average consumption</dt><dd><output id="consumption"></output> <small id="consumption-unit"></small></dd></div>
      </dl>
    </section>
  </div>
  <form class="controls">
    <fieldset><legend>Trip memory</legend>
      <label><input type="radio" name="memory" value="A" checked><span>Trip A</span></label>
      <label><input type="radio" name="memory" value="B"><span>Trip B</span></label>
    </fieldset>
    <fieldset><legend>Units</legend>
      <label><input type="radio" name="units" value="us" checked><span>US</span></label>
      <label><input type="radio" name="units" value="metric"><span>Metric</span></label>
    </fieldset>
  </form>
  <footer>Desktop study of the center display. Both trips use sample data.</footer>
</main>
<script>
  const trips = {
    A: {miles: 24.6, mph: 32, mpg: 23.5},
    B: {miles: 148.2, mph: 48, mpg: 26.4}
  };
  const form = document.querySelector("form");
  function display(id, value) {
    document.getElementById(id).textContent = value;
  }
  function render() {
    const memory = form.elements.memory.value;
    const metric = form.elements.units.value === "metric";
    const trip = trips[memory];
    const kmPerMile = 1.609344;
    const litersPerUsGallon = 3.785411784;
    display("bank", "Trip " + memory);
    display("distance", (trip.miles * (metric ? kmPerMile : 1)).toFixed(1));
    display("distance-unit", metric ? "km" : "mi");
    display("speed", Math.round(trip.mph * (metric ? kmPerMile : 1)));
    display("speed-unit", metric ? "km/h" : "mph");
    const consumption = metric ? 100 * litersPerUsGallon / (kmPerMile * trip.mpg) : trip.mpg;
    display("consumption", consumption.toFixed(1));
    display("consumption-unit", metric ? "L/100 km" : "US mpg");
  }
  form.addEventListener("change", render);
  render();
</script>
</html>
